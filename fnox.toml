# fnox.toml — secrets contract for htmx-demo.
#
# Secret VALUES live once in the macOS keychain (service "fnox"); this file only
# NAMES them. Nothing here is sensitive, so it is safe to commit.
#
# The CLOUDFLARE_* names are the cross-repo contract shared by every joeblew999
# repo (one CF account) — do not rename or prefix them. They are already present
# in the keychain and in ~/.config/fnox/config.toml; redeclared here so this repo
# states its own requirements instead of silently inheriting them.
#
# Set (only needed if the keychain is ever rebuilt):
#   fnox set -p keychain CLOUDFLARE_API_TOKEN  <token>
#   fnox set -p keychain CLOUDFLARE_ACCOUNT_ID <id>
# NEVER omit `-p keychain` — without it the value is inlined here as plaintext.
#
# Verify wiring: mise run cf:whoami

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
# Wrangler reads both of these from the environment. With them set, `wrangler
# deploy` and the d1:* tasks run non-interactively — no `wrangler login`.
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
CLOUDFLARE_ACCOUNT_ID = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
